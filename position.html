<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .d1{
            height: 200px;
            width: 200px;
            background-color: yellow;
            position: relative;
            top: 100px;
            left: 100px;
        }
        .d2{
            height: 200px;
            width: 200px;
            background-color: green;
            position: absolute;
            top: 50px;
            left:50px;
        }
        .d3{
            height: 200px;
            width: 200px;
            background-color: rgb(240, 190, 10);
            position: absolute;
            top: 50px;
            left:50px;
        }
        .d4{
            height: 200px;
            width: 200px;
            background-color: rgb(221, 31, 14);
            position: absolute;
            top: 50px;
            left:50px;
        }
        #div1{
           height: 300px;
           width: 500px;
           background-color: blue;
           position: relative;
           top: 200px;
           left: 200px;
        }
        #div2{
            height: 200px;
            width: 200px;
            background-color: red;
            border-radius: 100%;
            position: absolute;
            top: 150px;
            left: 250px;

        }
    </style>
</head>
<body>
    <div class="d1">
        <div class="d2">
            <div class="d3">
                <div class="d4">

                </div>
            </div>
        </div>
    </div>
    <br><br><br><br><br>
    <div id="div1">
        <div id="div2"></div>
    </div>
</body>
</html>
